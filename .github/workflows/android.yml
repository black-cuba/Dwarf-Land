name: Dwarf Land - Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validate and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Download Godot 4.7.2 stable
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Install Godot export templates
        run: |
          curl -fsSL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Android paths for Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate project and import assets
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/DwarfLand-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dwarf-Land-Android-debug
          path: build/DwarfLand-debug.apk
          if-no-files-found: error
          retention-days: 7
