name: Dwarf Land - Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Parse project and run gameplay tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import and parse Godot project
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Enforce 2D-only architecture
        run: |
          if grep -R -nE 'Node3D|Camera3D|MeshInstance3D|RigidBody3D|CharacterBody3D|Area3D|Vector3\(' scripts scenes; then
            echo "3D nodes or Vector3 rendering coordinates are not allowed in Dwarf Land."
            exit 1
          fi

      - name: Run gameplay logic tests
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/run_tests.gd
